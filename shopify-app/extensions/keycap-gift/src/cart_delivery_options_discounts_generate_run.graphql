query DeliveryInput {
  cart {
    bfPreview: attribute(key: "_bf_preview") {
      value
    }
    cost {
      subtotalAmount {
        currencyCode
      }
    }
    lines {
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            handle
          }
        }
      }
    }
    deliveryGroups {
      id
      deliveryAddress {
        countryCode
      }
    }
  }
  shop {
    # The client moved the sale to one window for everyone: started early
    # on 27/11, ends Mon 30/11 23:59 US Pacific (01/12 15:00 here, store time).
    localTime {
      bfUtc7: dateTimeBetween(startDateTime: "2026-11-26T00:00:00", endDateTime: "2026-12-01T15:00:00")
      bfUtc8: dateTimeBetween(startDateTime: "2026-11-26T00:00:00", endDateTime: "2026-12-01T15:00:00")
      bfUtc9: dateTimeBetween(startDateTime: "2026-11-26T00:00:00", endDateTime: "2026-12-01T15:00:00")
      bfIndonesia: dateTimeBetween(startDateTime: "2026-11-26T00:00:00", endDateTime: "2026-12-01T15:00:00")
      bfAustralia: dateTimeBetween(startDateTime: "2026-11-26T00:00:00", endDateTime: "2026-12-01T15:00:00")
      bfNewZealand: dateTimeBetween(startDateTime: "2026-11-26T00:00:00", endDateTime: "2026-12-01T15:00:00")
      bfCet: dateTimeBetween(startDateTime: "2026-11-26T00:00:00", endDateTime: "2026-12-01T15:00:00")
      bfUk: dateTimeBetween(startDateTime: "2026-11-26T00:00:00", endDateTime: "2026-12-01T15:00:00")
      bfCanada: dateTimeBetween(startDateTime: "2026-11-26T00:00:00", endDateTime: "2026-12-01T15:00:00")
      bfUnitedStates: dateTimeBetween(startDateTime: "2026-11-26T00:00:00", endDateTime: "2026-12-01T15:00:00")
    }
  }
  localization {
    country {
      isoCode
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
