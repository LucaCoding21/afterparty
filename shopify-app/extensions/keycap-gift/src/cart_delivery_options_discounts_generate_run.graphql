query DeliveryInput {
  cart {
    bfPreview: attribute(key: "_bf_preview") {
      value
    }
    cost {
      subtotalAmount {
        currencyCode
      }
    }
    lines {
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            handle
          }
        }
      }
    }
    deliveryGroups {
      id
      deliveryAddress {
        countryCode
      }
    }
  }
  shop {
    localTime {
      bfUtc7: dateTimeBetween(startDateTime: "2026-11-27T00:00:00", endDateTime: "2026-12-01T00:00:00")
      bfUtc8: dateTimeBetween(startDateTime: "2026-11-26T23:00:00", endDateTime: "2026-11-30T23:00:00")
      bfUtc9: dateTimeBetween(startDateTime: "2026-11-26T22:00:00", endDateTime: "2026-11-30T22:00:00")
      bfIndonesia: dateTimeBetween(startDateTime: "2026-11-26T22:00:00", endDateTime: "2026-12-01T00:00:00")
      bfAustralia: dateTimeBetween(startDateTime: "2026-11-26T20:00:00", endDateTime: "2026-11-30T23:00:00")
      bfNewZealand: dateTimeBetween(startDateTime: "2026-11-26T18:00:00", endDateTime: "2026-11-30T18:00:00")
      bfCet: dateTimeBetween(startDateTime: "2026-11-27T06:00:00", endDateTime: "2026-12-01T06:00:00")
      bfUk: dateTimeBetween(startDateTime: "2026-11-27T07:00:00", endDateTime: "2026-12-01T07:00:00")
      bfCanada: dateTimeBetween(startDateTime: "2026-11-27T10:30:00", endDateTime: "2026-12-01T15:00:00")
      bfUnitedStates: dateTimeBetween(startDateTime: "2026-11-27T12:00:00", endDateTime: "2026-12-01T17:00:00")
    }
  }
  localization {
    country {
      isoCode
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
