query CartInput {
  cart {
    cost {
      subtotalAmount {
        currencyCode
      }
    }
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      gift: attribute(key: "_gift") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            handle
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
