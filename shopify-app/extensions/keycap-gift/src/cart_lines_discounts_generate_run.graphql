query CartInput {
  cart {
    bfPreview: attribute(key: "_bf_preview") {
      value
    }
    cost {
      subtotalAmount {
        currencyCode
      }
    }
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      gift: attribute(key: "_gift") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            handle
          }
        }
      }
    }
  }
  shop {
    localTime {
      blackFriday: dateTimeBetween(
        startDateTime: "2026-11-27T00:00:00"
        endDateTime: "2026-12-01T00:00:00"
      )
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
